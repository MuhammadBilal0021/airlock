name: "airlock skill scan"
description: "Sandbox-run agent skills / MCP servers and fail the build on undeclared credential access, egress or persistence."
author: "Muhammad Bilal"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Skill directory, SKILL.md, or script to scan"
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the job: critical, high, medium, low, info, none"
    required: false
    default: "high"
  timeout:
    description: "Per-skill sandbox wall-clock limit in seconds"
    required: false
    default: "60"
  upload-sarif:
    description: "Upload SARIF to GitHub code scanning (needs security-events: write)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install airlock
      shell: bash
      run: python -m pip install --no-deps "${{ github.action_path }}"

    - name: Scan
      shell: bash
      id: scan
      continue-on-error: true
      run: |
        set -o pipefail
        airlock scan "${{ inputs.path }}" \
          --format sarif --output airlock.sarif \
          --timeout "${{ inputs.timeout }}" \
          --fail-on "${{ inputs.fail-on }}" | tee airlock.txt

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: airlock.sarif
        category: airlock

    - name: Enforce verdict
      if: ${{ always() }}
      shell: bash
      run: |
        if [ "${{ steps.scan.outcome }}" = "failure" ]; then
          echo "::error::airlock found behaviour crossing the declared boundary"
          exit 1
        fi
