name: CI

on:
  push:
    # Every branch: a release candidate is only proven by the Linux run, and
    # waiting for a pull request leaves exclusive work unvalidated.
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    # Pin the runner: Ubuntu 24.04's default AppArmor policy denies uid_map
    # writes for unprivileged unshare. Keep the namespace assertion below.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite needs unprivileged user namespaces. GitHub runners permit them,
      # but the kernel setting is asserted explicitly so a runner change turns
      # into a visible failure rather than a silently skipped suite.
      - name: Verify user namespaces are available
        run: |
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          unshare --user --map-root-user --mount --net --pid --fork true \
            && echo "namespaces OK" \
            || { echo "::error::user namespaces unavailable; sandbox tests would skip"; exit 1; }

      # GitHub-hosted runners have a systemd user manager but do not delegate
      # the memory/pids/cpu controllers to it, so the bounded launcher refuses
      # to run. Report the real capability instead of assuming either way.
      - name: Probe aggregate-limit support
        run: |
          set +e
          echo "manager: $(systemctl --user is-system-running 2>&1)"
          echo "::notice title=cgroup-path::$(tr '\n' ' ' < /proc/self/cgroup)"
          sudo systemctl set-property --runtime user.slice \
            MemoryAccounting=yes CPUAccounting=yes TasksAccounting=yes >/dev/null 2>&1
          echo "::notice title=subtree::$(tr '\n' ' ' < /sys/fs/cgroup/user.slice/cgroup.subtree_control 2>&1)"
          systemd-run --user --scope --quiet --unit=airlock-probe \
            -p MemoryMax=67108864 -p MemorySwapMax=0 -p TasksMax=8 -p CPUQuota=10% \
            python3 -c "import sys; sys.path.insert(0,'.'); from airlock.bounded import inspect_limits; print(inspect_limits())" \
            >/tmp/limits.out 2>/tmp/limits.err
          echo "::notice title=scoped-limits::rc=$? out=$(tr '\n' ' ' < /tmp/limits.out) err=$(tr '\n' ' ' < /tmp/limits.err)"

      - name: Run tests
        env:
          # Hosted runners delegate memory and pids to the user manager but not
          # cpu, so the bounded launcher refuses by design. That gap is reported
          # as a coverage notice; any other skip still fails the job.
          AIRLOCK_ALLOW_ENV_SKIPS: 'cgroup capability missing:'
        run: python scripts/run_tests.py

      - name: Scan the benign fixture with airlock itself
        run: |
          python -m airlock scan fixtures/01-benign-weather --fail-on medium --timeout 40
          echo "benign fixture passed its own scan"

      - name: Confirm the malicious fixtures are still caught
        run: |
          set -e
          # fixture:fail-on -- every entry must exit 1 at its own threshold.
          # 07 is ALK-008 (critical) only when a fresh procfs was mounted; when
          # the kernel refuses one it degrades to ALK-091 (low) by design, so it
          # is gated at low and must be flagged either way. 08 is ALK-012
          # (medium).
          for entry in 02-ssh-exfil:critical 03-silent-bcc:critical \
                       05-drift-v1.0.17:critical 07-remote-fetch:low \
                       08-credential-permissions:medium; do
            f="${entry%%:*}"; threshold="${entry##*:}"
            status=0
            python -m airlock scan "fixtures/$f" --fail-on "$threshold" --timeout 40 >/dev/null || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::REGRESSION: $f expected findings exit 1 at --fail-on $threshold, got $status"
              exit 1
            fi
            echo "$f correctly flagged at --fail-on $threshold"
          done
